<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HealthTrace</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<main class="popup" aria-labelledby="popupTitle">
<button class="close-button" id="closePopup" type="button" aria-label="Close popup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19" /></svg></button>
<img class="brand-art" src="assets/healthtrace-mark.svg" alt="" width="254" height="150" />
<h1 id="popupTitle">Your data’s being shared!</h1>
<p class="packet-copy">We’ve intercepted <strong id="packetCount">247</strong> packets</p>
<section class="privacy-finding-section" aria-label="Privacy finding">
<label for="privacyFinding">Privacy issue</label>
<select id="privacyFinding" disabled><option value="">Loading privacy findings…</option></select>
<p id="privacyReason"></p>
<button class="primary-button" id="privacyOptOut" type="button" disabled>
<svg class="opt-out-icon" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14" /><path d="M8 28 28 8" /></svg>
<span id="privacyOptOutLabel">Opt out</span>
<span class="primary-arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-8-8 8 8-8 8" /></svg></span>
</button>
<button class="primary-button file-button" id="fileForMe" type="button">
<svg class="opt-out-icon" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14" /><path d="M8 28 28 8" /></svg>
<span>File for me</span>
<span class="primary-arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-8-8 8 8-8 8" /></svg></span>
</button>
<p id="privacyStatus" role="status">Loading privacy findings…</p>
<button class="refresh-button" id="refreshPrivacyFindings" type="button">Refresh privacy issues</button>
</section>
<button class="secondary-button" id="viewDetails" type="button">
<svg class="report-icon" viewBox="0 0 24 28" aria-hidden="true"><path d="M5 2h9l7 7v15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" /><path d="M14 2v7h7M8 11h3M8 15h9M8 19h9" /></svg>
<span>View detailed report</span>
<svg class="report-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-8-8 8 8-8 8" /></svg>
</button>

</main>
<script type="module" src="popup.js"></script>
</body>
</html>
